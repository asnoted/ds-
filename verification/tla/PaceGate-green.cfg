\* Green run: the contracts that must always hold.
\* Single process: under two processes a fresh note by the other writer
\* lawfully opens the gate earlier than the own draw (the disk holds ONE
\* (lastSentAt, interval) pair), so a per-proc spacing claim would not
\* survive; that window is part of the finding run instead.
CONSTANTS Procs = {p1}

SPECIFICATION Spec

INVARIANT TypesOK
INVARIANT IntervalValid
INVARIANT GapSingle

CHECK_DEADLOCK FALSE
